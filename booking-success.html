<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking Received | Bohol Whale Shark</title><script src="/header.js?v=20261115-booking" defer></script><style>body{margin:0;background:#f1f6f6;color:#102b38;font:14px Arial}.wrap{min-height:80vh;display:grid;place-items:center;padding:120px 18px 50px}.card{max-width:580px;background:white;padding:40px;border-radius:18px;text-align:center;box-shadow:0 18px 55px #0522300d}.card h1{font-size:30px}.card p{line-height:1.8;color:#71838b}.code{padding:15px;background:#f4f9f9;font-weight:bold;margin:20px 0}.btn{display:inline-block;background:#061d2b;color:white;padding:14px 20px;border-radius:9px;text-decoration:none;font-weight:bold}</style></head><body><main class="wrap"><section class="card"><h1>Thank You!</h1><p>Your checkout has returned to our website. We are checking your payment status. The booking is not confirmed until payment is marked as paid.</p><div class="code" id="code">Loading booking reference…</div><p id="status">Please contact our team if you need help.</p><a class="btn" href="https://api.whatsapp.com/send?phone=639178754864">CONTACT OUR TEAM</a></section></main><script src="/whaleshark-config.js"></script><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';let code=new URLSearchParams(location.search).get('booking');document.getElementById('code').textContent=code||'Reference unavailable';let c=window.BW_SUPABASE_CONFIG||{};if(c.url&&c.anonKey&&code){let db=createClient(c.url,c.anonKey),{data,error}=await db.from('reservations').select('payment_status').eq('booking_code',code).maybeSingle();document.getElementById('status').textContent=error?'Your booking has been received. Please contact us to confirm payment.':data?.payment_status==='paid'?'Payment confirmed. Your reservation is paid.':'Payment status: '+(data?.payment_status||'pending')+'.'}</script></body></html>
