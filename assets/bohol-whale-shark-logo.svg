<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
<title id="title">Bohol Whale Shark</title>
<desc id="desc">Minimal whale shark silhouette with distinctive spots and the Bohol Whale Shark wordmark.</desc>
<defs>
  <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#62e5ef"/>
    <stop offset="1" stop-color="#1fc9dc"/>
  </linearGradient>
</defs>
<!-- Clean whale shark mark: broad head, dorsal/pectoral fins, tapered body and tail -->
<g transform="translate(24 28)" fill="none" stroke="url(#aqua)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <path fill="#05283b" d="M58 107 C91 72 148 55 223 56 C302 56 382 72 470 96 C500 104 528 109 558 110 C529 122 498 128 466 132 C381 143 300 158 216 159 C145 160 91 146 58 128 C47 122 47 115 58 107 Z"/>
  <path d="M245 61 C260 27 280 17 299 60"/>
  <path d="M326 145 C350 181 379 191 407 148"/>
  <path d="M183 70 C151 37 118 30 89 44 C107 58 122 71 132 83"/>
  <path d="M558 110 C594 91 625 77 658 78 C640 99 626 111 610 116 C628 124 642 138 658 159 C621 154 589 140 558 128"/>
  <path d="M105 169 C218 187 364 183 520 154" opacity=".65"/>
</g>
<!-- signature whale-shark spots -->
<g fill="#f5fbfc">
  <circle cx="287" cy="91" r="5"/><circle cx="316" cy="84" r="4"/><circle cx="344" cy="94" r="6"/>
  <circle cx="372" cy="88" r="4"/><circle cx="402" cy="99" r="5"/><circle cx="431" cy="95" r="3.5"/>
  <circle cx="301" cy="112" r="4"/><circle cx="332" cy="120" r="5"/><circle cx="365" cy="111" r="3.5"/>
  <circle cx="397" cy="121" r="5"/><circle cx="428" cy="114" r="4"/><circle cx="458" cy="119" r="3.5"/>
  <circle cx="273" cy="132" r="3.5"/><circle cx="305" cy="141" r="4"/><circle cx="342" cy="137" r="3"/>
</g>
<!-- wordmark -->
<text x="700" y="108" fill="#f5fbfc" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="10">BOHOL</text>
<text x="702" y="155" fill="#62e5ef" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="6">WHALE SHARK</text>
<path d="M703 177 H842" stroke="#62e5ef" stroke-width="2" opacity=".55"/>
</svg>